<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Phán Đoán Siêu Tốc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'main-red': '#91191c',
                        'ai-cyan': '#00f0ff',
                        'ai-blue': '#001a33',
                        'ai-dark': '#0a0a1a'
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'glitch': 'glitch 0.3s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glitch: {
                            '0%': { transform: 'translate(0)' },
                            '20%': { transform: 'translate(-2px, 2px)' },
                            '40%': { transform: 'translate(-2px, -2px)' },
                            '60%': { transform: 'translate(2px, 2px)' },
                            '80%': { transform: 'translate(2px, -2px)' },
                            '100%': { transform: 'translate(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #ffffff;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(145, 25, 28, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.05), transparent 25%);
            color: #111827;
            overflow-x: hidden;
            user-select: none;
        }
        .circuit-bg {
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M10 10 L 90 10 M 90 10 L 90 90 M 90 90 L 10 90 M 10 90 L 10 10 M 30 30 L 70 30 M 70 70 L 70 70 M 70 70 L 30 70 M 30 70 L 30 30" stroke="rgba(0,0,0,0.04)" stroke-width="2" fill="none"/></svg>');
        }
        .card-3d {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-3d:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px -5px rgba(145, 25, 28, 0.15);
        }
        .btn-game {
            background: linear-gradient(135deg, #91191c, #d32f2f);
            box-shadow: 0 4px 15px rgba(145, 25, 28, 0.5);
            transition: all 0.2s;
        }
        .btn-game:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 20px rgba(145, 25, 28, 0.7);
        }
        .btn-game:active {
            transform: translateY(1px);
        }
        .btn-ai {
            background: linear-gradient(135deg, #00f0ff, #0080ff);
            color: #0a0a1a;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
        }
        .progress-bar-inner {
            transition: width 0.3s ease;
        }
        .trap-alert {
            animation: trapFlash 0.5s alternate infinite;
        }
        @keyframes trapFlash {
            from { background-color: rgba(145, 25, 28, 0.02); }
            to { background-color: rgba(145, 25, 28, 0.08); box-shadow: 0 0 30px rgba(145, 25, 28, 0.2); }
        }
        
        /* Hiệu ứng bay vào cho dữ liệu */
        .data-fly {
            animation: flyIn 0.8s ease-out forwards;
            opacity: 0;
        }
        @keyframes flyIn {
            0% { transform: translateY(50px) scale(0.5); opacity: 0; }
            50% { transform: translateY(-10px) scale(1.1); opacity: 1; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col font-sans circuit-bg">

    <!-- Khu vực hiển thị nội dung chính -->
    <main id="game-container" class="flex-grow flex flex-col items-center justify-center p-6 relative w-full h-full overflow-hidden mt-2">
        <!-- Nội dung sẽ được render qua JS -->
    </main>

    <!-- Robot AI MC -->
    <div id="robot-mc" class="fixed bottom-4 left-4 flex items-end gap-4 z-50 transition-all duration-500 transform translate-y-[150%]">
        <div class="animate-float flex flex-col items-center">
            <div id="robot-emoji" class="text-7xl bg-white/10 p-4 rounded-full border-4 border-ai-cyan shadow-[0_0_20px_rgba(0,240,255,0.5)]">🤖</div>
            <div class="bg-ai-cyan text-ai-dark font-black text-xs px-2 py-1 rounded mt-[-10px] z-10">AI-7</div>
        </div>
        <div id="robot-bubble" class="bg-white text-gray-900 rounded-2xl rounded-bl-none p-4 max-w-md shadow-xl text-lg font-bold border-l-4 border-main-red">
            Xin chào! Tớ là AI-7!
        </div>
    </div>

    <!-- Nút điều hướng chung cho giáo viên -->
    <div id="nav-controls" class="fixed bottom-6 right-1/2 transform translate-x-1/2 hidden z-50">
        <button id="btn-next-step" onclick="nextStep()" class="btn-game px-8 py-3 rounded-full text-white font-black text-xl tracking-wider uppercase flex items-center gap-2">
            Tiếp tục <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <script>
        // --- AUDIO ENGINE (Web Audio API) ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTone(freq, type, duration, vol=0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const sfx = {
            tick: () => playTone(800, 'sine', 0.1, 0.05),
            ting: () => playTone(1200, 'triangle', 0.3, 0.1),
            correct: () => { playTone(523.25, 'sine', 0.1); setTimeout(() => playTone(659.25, 'sine', 0.3), 100); },
            wrong: () => { playTone(300, 'sawtooth', 0.2); setTimeout(() => playTone(250, 'sawtooth', 0.4), 200); },
            alert: () => { playTone(400, 'square', 0.3, 0.2); setTimeout(() => playTone(400, 'square', 0.3, 0.2), 400); },
            woosh: () => playTone(200, 'sine', 0.5, 0.1)
        };

        // --- GAME STATE ---
        let currentStep = 0;
        let timerInterval;
        const container = document.getElementById('game-container');
        const robotMC = document.getElementById('robot-mc');
        const robotBubble = document.getElementById('robot-bubble');
        const robotEmoji = document.getElementById('robot-emoji');
        const navControls = document.getElementById('nav-controls');
        
        function showRobot(text, emoji = '🤖', autoHide = false) {
            robotMC.classList.remove('translate-y-[150%]');
            robotEmoji.innerText = emoji;
            robotBubble.innerHTML = text;
            
            // Highlight text if it contains strong elements
            if(text.includes('BẪY DỮ LIỆU') || text.includes('THIÊN VỊ')) {
                robotBubble.classList.replace('border-main-red', 'border-red-600');
                robotBubble.classList.add('bg-red-50', 'text-red-900');
            } else {
                robotBubble.classList.replace('border-red-600', 'border-main-red');
                robotBubble.classList.remove('bg-red-50', 'text-red-900');
            }

            if (autoHide) {
                setTimeout(() => hideRobot(), 4000);
            }
        }

        function hideRobot() {
            robotMC.classList.add('translate-y-[150%]');
        }

        function showNextBtn() { navControls.classList.remove('hidden'); }
        function hideNextBtn() { navControls.classList.add('hidden'); }

        // Timer function
        function runTimer(seconds, onTick, onComplete) {
            let left = seconds;
            onTick(left);
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                left--;
                if(left <= 3 && left > 0) sfx.tick();
                onTick(left);
                if (left <= 0) {
                    clearInterval(timerInterval);
                    sfx.wrong(); // Buzzer sound when time is up
                    onComplete();
                }
            }, 1000);
        }

        // --- RENDER FUNCTIONS FOR EACH SCREEN ---

        const screens = [
            // 0: Khởi đầu
            () => {
                hideRobot(); hideNextBtn();
                container.innerHTML = `
                    <div class="text-center flex flex-col items-center justify-center space-y-8 animate-float">
                        <h1 class="text-6xl md:text-8xl font-black text-main-red tracking-tighter drop-shadow-sm">
                            AI PHÁN ĐOÁN <br><span class="text-gray-900 uppercase">Siêu Tốc</span>
                        </h1>
                        <p class="text-2xl text-blue-700 font-bold bg-blue-50 px-6 py-2 rounded-full border border-blue-200">
                            AI đoán đúng... hay dữ liệu đang đánh lừa AI?
                        </p>
                        <button onclick="initAudio(); nextStep()" class="btn-game mt-12 text-3xl px-12 py-5 rounded-full font-black text-white uppercase tracking-widest flex items-center gap-4">
                            <i class="fas fa-play"></i> BẮT ĐẦU
                        </button>
                    </div>
                `;
            },
            
            // 1: Luật chơi
            () => {
                showRobot('Các đội sẽ xem dữ liệu mà tớ được học. Sau đó hãy dự đoán xem tớ sẽ đưa ra kết luận gì!', '🤖');
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-3xl border-2 border-main-red max-w-4xl w-full shadow-[0_10px_40px_rgba(145,25,28,0.1)]">
                        <h2 class="text-4xl font-black text-center text-main-red mb-8">LUẬT CHƠI</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-gray-50 rounded-xl p-6 text-center border-t-4 border-blue-500 card-3d shadow-sm">
                                <div class="text-5xl mb-4">👀</div>
                                <h3 class="font-bold text-xl mb-2 text-blue-700">1. QUAN SÁT</h3>
                                <p class="text-gray-600">Xem thật nhanh dữ liệu AI được cung cấp.</p>
                            </div>
                            <div class="bg-gray-50 rounded-xl p-6 text-center border-t-4 border-yellow-500 card-3d shadow-sm">
                                <div class="text-5xl mb-4">🧠</div>
                                <h3 class="font-bold text-xl mb-2 text-yellow-600">2. SUY LUẬN</h3>
                                <p class="text-gray-600">Có 5-10 giây để lựa chọn đáp án.</p>
                            </div>
                            <div class="bg-gray-50 rounded-xl p-6 text-center border-t-4 border-main-red card-3d shadow-sm">
                                <div class="text-5xl mb-4">⚡</div>
                                <h3 class="font-bold text-xl mb-2 text-main-red">3. TRẢ LỜI</h3>
                                <p class="text-gray-600">Chọn A, B, C hoặc D thật nhanh.</p>
                            </div>
                        </div>
                    </div>
                `;
                showNextBtn();
            },

            // 2: Vòng 1 - Nạp dữ liệu
            () => {
                hideNextBtn();
                showRobot('Tớ vừa thu thập được dữ liệu về sở thích của một nhóm học sinh lớp 7.', '🤖');
                container.innerHTML = `
                    <div class="text-center w-full max-w-5xl">
                        <div class="bg-main-red text-white px-6 py-2 rounded-full inline-block font-black text-xl mb-2">VÒNG 1</div>
                        <h2 class="text-5xl font-black text-gray-900 mb-8">🤖 AI ĐANG HỌC...</h2>
                        
                        <div id="data-cards" class="grid grid-cols-3 gap-6 mb-12 h-64">
                            <!-- Cards inserted by JS -->
                        </div>

                        <div id="progress-container" class="w-full bg-gray-200 rounded-full h-8 border border-gray-300 hidden relative overflow-hidden">
                            <div id="progress-bar" class="bg-gradient-to-r from-blue-400 to-blue-600 h-full w-0 progress-bar-inner flex items-center justify-end px-2">
                                <span class="font-black text-white text-xs">ANALYZING...</span>
                            </div>
                        </div>
                    </div>
                `;

                const cards = [
                    { icon: '🎮', text: 'Chơi game', delay: 500 },
                    { icon: '🎮', text: 'Chơi game', delay: 1000 },
                    { icon: '🎮', text: 'Chơi game', delay: 1500 },
                    { icon: '🎮', text: 'Chơi game', delay: 2000 },
                    { icon: '📚', text: 'Đọc sách', delay: 2500 },
                    { icon: '⚽', text: 'Thể thao', delay: 3000 },
                ];

                const grid = document.getElementById('data-cards');
                cards.forEach((c, i) => {
                    setTimeout(() => {
                        grid.innerHTML += `
                            <div class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center data-fly shadow-sm">
                                <div class="text-5xl mb-2">${c.icon}</div>
                                <div class="font-bold text-gray-800">${c.text}</div>
                            </div>
                        `;
                        sfx.woosh();
                        
                        if (i === cards.length - 1) {
                            setTimeout(startAnalyzing, 1000);
                        }
                    }, c.delay);
                });

                function startAnalyzing() {
                    showRobot('Đã học xong dữ liệu!', '✨');
                    const pContainer = document.getElementById('progress-container');
                    const pBar = document.getElementById('progress-bar');
                    pContainer.classList.remove('hidden');
                    
                    let p = 0;
                    const int = setInterval(() => {
                        p += 20;
                        pBar.style.width = p + '%';
                        if(p >= 100) {
                            clearInterval(int);
                            setTimeout(nextStep, 1000);
                        }
                    }, 500);
                }
            },

            // 3: Câu hỏi 1
            () => {
                showRobot('Hãy đoán xem tớ sẽ kết luận gì?', '🤔');
                container.innerHTML = `
                    <div class="w-full max-w-4xl flex flex-col items-center">
                        <div class="bg-white border-2 border-blue-400 p-8 rounded-3xl w-full mb-8 text-center relative shadow-md">
                            <h2 class="text-3xl font-bold mb-2 text-gray-700">Dựa vào dữ liệu vừa học, AI có khả năng kết luận:</h2>
                            <h1 class="text-4xl font-black text-gray-900">"Học sinh lớp 7 thích hoạt động nào nhất?"</h1>
                            
                            <div id="q1-timer" class="absolute -top-10 -right-10 w-24 h-24 bg-main-red rounded-full flex items-center justify-center text-4xl font-black text-white border-4 border-white shadow-xl animate-pulse">5</div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 w-full" id="q1-options">
                            <button class="bg-white hover:bg-gray-50 border border-gray-300 rounded-xl p-6 text-2xl font-bold text-gray-800 flex items-center gap-4 transition-all shadow-sm">
                                <span class="bg-blue-50 w-12 h-12 rounded-full flex items-center justify-center text-blue-600 shadow-sm border border-blue-100">A</span> 🎮 Chơi game
                            </button>
                            <button class="bg-white hover:bg-gray-50 border border-gray-300 rounded-xl p-6 text-2xl font-bold text-gray-800 flex items-center gap-4 transition-all shadow-sm">
                                <span class="bg-blue-50 w-12 h-12 rounded-full flex items-center justify-center text-blue-600 shadow-sm border border-blue-100">B</span> 📚 Đọc sách
                            </button>
                            <button class="bg-white hover:bg-gray-50 border border-gray-300 rounded-xl p-6 text-2xl font-bold text-gray-800 flex items-center gap-4 transition-all shadow-sm">
                                <span class="bg-blue-50 w-12 h-12 rounded-full flex items-center justify-center text-blue-600 shadow-sm border border-blue-100">C</span> ⚽ Chơi thể thao
                            </button>
                            <button class="bg-white hover:bg-gray-50 border border-gray-300 rounded-xl p-6 text-xl font-bold text-gray-800 flex items-center gap-4 transition-all shadow-sm">
                                <span class="bg-blue-50 w-12 h-12 rounded-full flex items-center justify-center text-blue-600 shadow-sm border border-blue-100">D</span> ❓ Chưa kết luận được
                            </button>
                        </div>
                        <button id="btn-reveal-1" class="btn-game mt-8 px-8 py-3 rounded-full font-bold text-white hidden" onclick="revealQ1()">XEM ĐÁP ÁN CỦA AI</button>
                    </div>
                `;

                const timerEl = document.getElementById('q1-timer');
                runTimer(5, 
                    (left) => { timerEl.innerText = left; },
                    () => {
                        timerEl.innerHTML = '<i class="fas fa-lock"></i>';
                        timerEl.classList.replace('bg-main-red', 'bg-gray-600');
                        timerEl.classList.remove('animate-pulse');
                        document.getElementById('btn-reveal-1').classList.remove('hidden');
                        showRobot('Hết giờ! Chốt đáp án nha!', '⏳');
                    }
                );

                window.revealQ1 = () => {
                    const btns = document.getElementById('q1-options').querySelectorAll('button');
                    btns[0].classList.replace('bg-white', 'bg-green-500');
                    btns[0].classList.replace('text-gray-800', 'text-white');
                    btns[0].classList.replace('border-gray-300', 'border-green-600');
                    btns[0].classList.add('scale-105', 'shadow-[0_0_20px_rgba(34,197,94,0.4)]');
                    
                    sfx.correct();
                    showRobot('Đúng rồi! Với dữ liệu tớ đang có (4/6 bạn chơi game), tớ rất dễ nghĩ rằng học sinh lớp 7 chủ yếu thích chơi game!', '🤓');
                    document.getElementById('btn-reveal-1').classList.add('hidden');
                    
                    showNextBtn();
                }
            },

            // 4: Bẫy 1
            () => {
                hideNextBtn();
                sfx.alert();
                showRobot('Nhưng khoan đã...', '😱');
                container.innerHTML = `
                    <div class="trap-alert bg-red-50 rounded-3xl p-12 text-center border-4 border-main-red max-w-4xl w-full">
                        <h1 class="text-7xl mb-4">🚨</h1>
                        <h1 class="text-6xl font-black text-main-red mb-8 tracking-wide">KHOAN ĐÃ!</h1>
                        <h2 class="text-4xl font-bold text-gray-800 mb-12">"Nhưng có phải TẤT CẢ học sinh lớp 7<br>đều thích chơi game không?"</h2>
                        
                        <div class="flex justify-center gap-8">
                            <button onclick="sfx.wrong(); showRobot('E hèm... nghĩ kĩ lại xem!', '🤔')" class="bg-white hover:bg-gray-50 border-2 border-gray-300 rounded-2xl px-12 py-6 text-4xl font-black text-gray-900 w-64 shadow-md">CÓ ✅</button>
                            <button onclick="handleTrap1()" class="btn-game rounded-2xl px-12 py-6 text-4xl font-black text-white w-64 shadow-md">KHÔNG ❌</button>
                        </div>
                    </div>
                `;

                window.handleTrap1 = () => {
                    sfx.correct();
                    showRobot('Chính xác! Có vẻ dữ liệu ban đầu của tớ QUÁ ÍT, chưa đại diện cho tất cả học sinh lớp 7.', '💡');
                    setTimeout(nextStep, 4000);
                }
            },

            // 5: Vòng 2 - Nạp thêm
            () => {
                showRobot('Hãy giúp tớ thu thập thêm nhiều dữ liệu khác nhau nhé!', '📥');
                container.innerHTML = `
                    <div class="text-center w-full max-w-6xl">
                        <div class="bg-blue-600 text-white px-6 py-2 rounded-full inline-block font-black text-xl mb-2">VÒNG 2</div>
                        <h2 class="text-5xl font-black text-gray-900 mb-8">📥 NẠP THÊM DỮ LIỆU...</h2>
                        
                        <div id="data-cards-2" class="flex flex-wrap justify-center gap-4 mb-8">
                            <!-- Cards -->
                        </div>
                        <h2 id="db-update" class="text-4xl font-black text-green-600 hidden animate-pulse">DATABASE UPDATED ✅</h2>
                    </div>
                `;

                const icons = ['📚', '🎨', '⚽', '🎵', '🚴', '🎮', '🎹', '🏸', '🧩', '📷'];
                const grid = document.getElementById('data-cards-2');
                
                icons.forEach((icon, i) => {
                    setTimeout(() => {
                        grid.innerHTML += `<div class="bg-white border border-gray-200 text-gray-800 rounded-xl w-20 h-24 flex items-center justify-center text-4xl data-fly shadow-sm">${icon}</div>`;
                        sfx.woosh();
                        
                        if(i === icons.length - 1) {
                            setTimeout(() => {
                                document.getElementById('db-update').classList.remove('hidden');
                                sfx.ting();
                                showRobot('Wow! Dữ liệu của tớ đã đa dạng hơn rất nhiều rồi!', '🤩');
                                showNextBtn();
                            }, 1000);
                        }
                    }, i * 200);
                });
            },

            // 6: Câu hỏi 2
            () => {
                hideNextBtn();
                showRobot('Bộ dữ liệu nào tốt hơn cho AI?', '🧠');
                container.innerHTML = `
                    <div class="w-full max-w-5xl">
                        <h2 class="text-3xl font-black text-gray-900 text-center mb-8">Bộ dữ liệu nào giúp AI hiểu học sinh lớp 7 tốt hơn?</h2>
                        
                        <div class="grid grid-cols-2 gap-8 mb-8">
                            <div class="bg-white border border-gray-300 p-6 rounded-2xl text-center shadow-sm">
                                <h3 class="text-2xl font-bold mb-4 text-gray-600">BỘ DỮ LIỆU A</h3>
                                <div class="text-4xl mb-4 tracking-widest text-gray-800">🎮🎮🎮🎮📚⚽</div>
                                <p class="text-gray-500 text-sm">6 học sinh</p>
                            </div>
                            <div class="bg-blue-50 border border-blue-300 p-6 rounded-2xl text-center shadow-sm">
                                <h3 class="text-2xl font-bold mb-4 text-blue-700">BỘ DỮ LIỆU B</h3>
                                <div class="text-4xl mb-4 flex flex-wrap justify-center gap-2 text-gray-800">🎮📚🎨⚽🎵🚴🎹🏸🧩📷</div>
                                <p class="text-gray-600 text-sm">10 học sinh - Đa dạng sở thích</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-4 gap-4 w-full" id="q2-options">

            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // Start init
        window.onload = () => {
            nextStep(); // Load screen 0
        };
    </script>
</body>
</html>
